<div class="reset-password-page">
  <div class="reset-password-card">

    <!-- Brand -->
    <div class="reset-password-card__brand">
      <div class="reset-password-card__logo">
        D
      </div>

      <h1>Daandata</h1>

      <p>
        Donation management made simple.
      </p>
    </div>

    <!-- Header -->
    <div class="reset-password-card__header">
      <h2>Reset your password</h2>

      <p>
        Choose a new password for your account.
      </p>
    </div>

    <!-- Error -->
    @if (errorMessage) {
      <div
        class="reset-password-card__error"
        role="alert"
      >
        <span class="reset-password-card__error-icon">
          !
        </span>

        <span>
          {{ errorMessage }}
        </span>
      </div>
    }

    <!-- Success -->
    @if (successMessage) {
      <div
        class="reset-password-card__success"
        role="status"
      >
        <span class="reset-password-card__success-icon">
          ✓
        </span>

        <span>
          {{ successMessage }}
        </span>
      </div>
    }

    <!-- Form -->
    <form
      class="reset-password-form"
      (ngSubmit)="onSubmit()"
    >

      <!-- New Password -->
      <div class="reset-password-form__field">
        <label for="password">
          New password
        </label>

        <div class="reset-password-form__password">
          <input
            id="password"
            [type]="
              showPassword
                ? 'text'
                : 'password'
            "
            name="password"
            [(ngModel)]="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            [disabled]="loading"
            required
          />

          <button
            type="button"
            class="reset-password-form__password-toggle"
            [attr.aria-label]="
              showPassword
                ? 'Hide password'
                : 'Show password'
            "
            [disabled]="loading"
            (click)="togglePasswordVisibility()"
          >
            @if (showPassword) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 3l18 18"></path>

                <path
                  d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                  d="M9.9 5.2A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7s-3.5 7-10 7c-1.5 0-2.8-.3-4-.8"
                ></path>

                <path
                  d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"
                ></path>
              </svg>
            }
          </button>
        </div>

        <span class="reset-password-form__hint">
          Minimum 6 characters
        </span>
      </div>

      <!-- Confirm Password -->
      <div class="reset-password-form__field">
        <label for="confirm-password">
          Confirm new password
        </label>

        <div class="reset-password-form__password">
          <input
            id="confirm-password"
            [type]="
              showConfirmPassword
                ? 'text'
                : 'password'
            "
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            [disabled]="loading"
            required
          />

          <button
            type="button"
            class="reset-password-form__password-toggle"
            [attr.aria-label]="
              showConfirmPassword
                ? 'Hide password'
                : 'Show password'
            "
            [disabled]="loading"
            (click)="
              toggleConfirmPasswordVisibility()
            "
          >
            @if (showConfirmPassword) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 3l18 18"></path>

                <path
                  d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                  d="M9.9 5.2A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7s-3.5 7-10 7c-1.5 0-2.8-.3-4-.8"
                ></path>

                <path
                  d="M6.2 6.2C3.5 6.2 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"
                ></path>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="reset-password-form__submit"
        [disabled]="loading"
      >
        @if (loading) {
          <span
            class="reset-password-form__spinner"
            aria-hidden="true"
          ></span>

          <span>
            Updating password...
          </span>
        } @else {
          <span>
            Update Password
          </span>
        }
      </button>

    </form>

    <!-- Login -->
    <div class="reset-password-card__login">
      <button
        type="button"
        class="reset-password-card__login-link"
        [disabled]="loading"
        (click)="goToLogin()"
      >
        ← Back to Sign In
      </button>
    </div>

  </div>
</div>
