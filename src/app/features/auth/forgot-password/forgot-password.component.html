<div class="forgot-password-page">
  <div class="forgot-password-card">

    <!-- Brand -->
    <div class="forgot-password-card__brand">
      <div class="forgot-password-card__logo">
        D
      </div>

      <h1>Daandata</h1>

      <p>
        Donation management made simple.
      </p>
    </div>

    <!-- Header -->
    <div class="forgot-password-card__header">
      <h2>Forgot your password?</h2>

      <p>
        Enter your email address and we'll send
        you a link to reset your password.
      </p>
    </div>

    <!-- Error -->
    @if (errorMessage) {
      <div
        class="forgot-password-card__error"
        role="alert"
      >
        <span class="forgot-password-card__error-icon">
          !
        </span>

        <span>
          {{ errorMessage }}
        </span>
      </div>
    }

    <!-- Success -->
    @if (successMessage) {
      <div
        class="forgot-password-card__success"
        role="status"
      >
        <span class="forgot-password-card__success-icon">
          ✓
        </span>

        <span>
          {{ successMessage }}
        </span>
      </div>
    }

    <!-- Form -->
    <form
      class="forgot-password-form"
      (ngSubmit)="onSubmit()"
    >

      <div class="forgot-password-form__field">
        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          [disabled]="loading"
          required
        />
      </div>

      <button
        type="submit"
        class="forgot-password-form__submit"
        [disabled]="loading"
      >
        @if (loading) {
          <span
            class="forgot-password-form__spinner"
            aria-hidden="true"
          ></span>

          <span>
            Sending...
          </span>
        } @else {
          <span>
            Send Reset Link
          </span>
        }
      </button>

    </form>

    <!-- Back to login -->
    <div class="forgot-password-card__login">
      <button
        type="button"
        class="forgot-password-card__login-link"
        [disabled]="loading"
        (click)="goToLogin()"
      >
        ← Back to Sign In
      </button>
    </div>

  </div>
</div>
